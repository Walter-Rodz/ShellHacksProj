# Render blueprint for the backend API (https://render.com/docs/blueprint-spec).
# In Render: New > Blueprint > pick this repo and the Backend branch. Render then asks for the values marked
# `sync: false` (they are secrets or depend on your domain, so they aren't stored here).
services:
  - type: web
    name: goretro-api
    runtime: node
    plan: free # free instances sleep after ~15 min idle; "starter" stays awake
    rootDir: backend
    buildCommand: npm ci
    # Rebuilds the console database from data/consoles.json on every start, then starts the API
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Your site's addresses, comma-separated, e.g. https://yourdomain.com,https://www.yourdomain.com,https://*.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Google Gemini key for the AI Builder, chat and AI recommendations
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.1-flash-lite
